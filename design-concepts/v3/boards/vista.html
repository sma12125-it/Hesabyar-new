<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>ویستا — برد</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 3000px; height: 820px; overflow: hidden; }
    body { background: #efe6dc; color: #1b2430; font-family: Vazirmatn, sans-serif; display: flex; flex-direction: column; }
    header { height: 168px; padding: 32px 56px 0; display: flex; justify-content: space-between; align-items: flex-end; }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: .16em; color: #7b736a; }
    h1 { margin: 4px 0 0; font-size: 64px; font-weight: 800; line-height: 1; }
    .pitch { margin: 8px 0 0; font-size: 20px; color: #3c4654; font-weight: 550; max-width: 980px; }
    .swatches { display: flex; gap: 16px; direction: ltr; }
    .sw i { display: block; width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(27,36,48,.12); }
    .sw span { display: block; margin-top: 6px; font-size: 11px; color: #7b736a; text-align: center; font-weight: 650; }
    .row { flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 14px; padding-top: 6px; }
    figure { margin: 0; }
    .bezel { background: #1b2430; border-radius: 28px; padding: 7px; box-shadow: 0 18px 40px rgba(40,30,20,.16); }
    .phone img { width: 198px; height: 428px; object-fit: cover; object-position: top; border-radius: 22px; display: block; }
    .desk img { width: 686px; height: 428px; object-fit: cover; object-position: top; border-radius: 16px; display: block; }
    figcaption { text-align: center; margin-top: 8px; font-size: 14px; font-weight: 750; }
    .meta { position: absolute; left: 56px; bottom: 16px; font-size: 12px; color: #8a8178; direction: ltr; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="kicker">HESABYAR · V3 · VISTA</div>
      <h1>ویستا</h1>
      <p class="pitch">روز با حجم. مش گرم، کارت‌های بانکی روی هم، آیکون نرم. مانده و ثبت بدون شلوغی اضافه.</p>
    </div>
    <div class="swatches">
      <div class="sw"><i style="background:#f7f2eb"></i><span>#F7F2EB</span></div>
      <div class="sw"><i style="background:#1b2430"></i><span>#1B2430</span></div>
      <div class="sw"><i style="background:#f2b15a"></i><span>#F2B15A</span></div>
      <div class="sw"><i style="background:#3c78e6"></i><span>#3C78E6</span></div>
      <div class="sw"><i style="background:#ef6d57"></i><span>#EF6D57</span></div>
    </div>
  </header>
  <div class="row">
    <figure><div class="bezel phone"><img src="../screenshots/vista-login.png" alt="" /></div><figcaption>ورود</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/vista-home.png" alt="" /></div><figcaption>خانه</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/vista-transaction.png" alt="" /></div><figcaption>ثبت</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/vista-investments.png" alt="" /></div><figcaption>سبد</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/vista-asset.png" alt="" /></div><figcaption>دارایی</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/vista-reports.png" alt="" /></div><figcaption>گزارش</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/vista-settings.png" alt="" /></div><figcaption>تنظیمات</figcaption></figure>
    <figure><div class="bezel desk"><img src="../screenshots/vista-desktop.png" alt="" /></div><figcaption>دسکتاپ ۱۴۴۰</figcaption></figure>
  </div>
  <div class="meta">Vazirmatn · 390×844 · 1440×900</div>
</body>
</html>
