<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>ریتم — برد</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 3000px; height: 820px; overflow: hidden; }
    body { background: #161810; color: #f6f3ea; font-family: Vazirmatn, sans-serif; display: flex; flex-direction: column; }
    header { height: 168px; padding: 32px 56px 0; display: flex; justify-content: space-between; align-items: flex-end; }
    .kicker { font-size: 13px; font-weight: 800; letter-spacing: .16em; color: #dff25a; }
    h1 { margin: 4px 0 0; font-size: 64px; font-weight: 800; line-height: 1; }
    .pitch { margin: 8px 0 0; font-size: 20px; color: #e4e0d4; font-weight: 550; max-width: 980px; }
    .swatches { display: flex; gap: 16px; direction: ltr; }
    .sw i { display: block; width: 34px; height: 34px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
    .sw span { display: block; margin-top: 6px; font-size: 11px; color: #b7b3a6; text-align: center; font-weight: 650; }
    .row { flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 14px; padding-top: 6px; }
    figure { margin: 0; }
    .bezel { background: #0c0e0b; border-radius: 8px; padding: 7px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
    .phone img { width: 198px; height: 428px; object-fit: cover; object-position: top; border-radius: 4px; display: block; }
    .desk img { width: 686px; height: 428px; object-fit: cover; object-position: top; border-radius: 4px; display: block; }
    figcaption { text-align: center; margin-top: 8px; font-size: 14px; font-weight: 750; }
    .meta { position: absolute; left: 56px; bottom: 16px; font-size: 12px; color: #9a968a; direction: ltr; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="kicker">HESABYAR · V3 · RITM</div>
      <h1>ریتم</h1>
      <p class="pitch">گرافیک تیز. عدد خیلی درشت، نمودار ضخیم، مرجان و لیمو. بدون مات‌کردن شیشه، با دسترسی مستقیم به تب‌ها.</p>
    </div>
    <div class="swatches">
      <div class="sw"><i style="background:#10120e"></i><span>#10120E</span></div>
      <div class="sw"><i style="background:#f6f3ea"></i><span>#F6F3EA</span></div>
      <div class="sw"><i style="background:#ff4d32"></i><span>#FF4D32</span></div>
      <div class="sw"><i style="background:#dff25a"></i><span>#DFF25A</span></div>
      <div class="sw"><i style="background:#1c1f18"></i><span>#1C1F18</span></div>
    </div>
  </header>
  <div class="row">
    <figure><div class="bezel phone"><img src="../screenshots/ritm-login.png" alt="" /></div><figcaption>ورود</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/ritm-home.png" alt="" /></div><figcaption>خانه</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/ritm-transaction.png" alt="" /></div><figcaption>ثبت</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/ritm-investments.png" alt="" /></div><figcaption>سبد</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/ritm-asset.png" alt="" /></div><figcaption>دارایی</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/ritm-reports.png" alt="" /></div><figcaption>گزارش</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/ritm-settings.png" alt="" /></div><figcaption>تنظیمات</figcaption></figure>
    <figure><div class="bezel desk"><img src="../screenshots/ritm-desktop.png" alt="" /></div><figcaption>دسکتاپ ۱۴۴۰</figcaption></figure>
  </div>
  <div class="meta">Vazirmatn · 390×844 · 1440×900</div>
</body>
</html>
