<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>آئورا — برد</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 3000px; height: 820px; overflow: hidden; }
    body { background: #0c1022; color: #f4f7ff; font-family: Vazirmatn, sans-serif; display: flex; flex-direction: column; }
    header { height: 168px; padding: 32px 56px 0; display: flex; justify-content: space-between; align-items: flex-end; }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: .16em; color: #9aa6c8; }
    h1 { margin: 4px 0 0; font-size: 64px; font-weight: 800; line-height: 1; }
    .pitch { margin: 8px 0 0; font-size: 20px; color: #d5dcf2; font-weight: 550; max-width: 980px; }
    .swatches { display: flex; gap: 16px; direction: ltr; }
    .sw i { display: block; width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
    .sw span { display: block; margin-top: 6px; font-size: 11px; color: #9aa6c8; text-align: center; font-weight: 650; }
    .row { flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 14px; padding-top: 6px; }
    figure { margin: 0; }
    .bezel { background: #05060e; border-radius: 28px; padding: 7px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
    .phone img { width: 198px; height: 428px; object-fit: cover; object-position: top; border-radius: 22px; display: block; }
    .desk img { width: 686px; height: 428px; object-fit: cover; object-position: top; border-radius: 16px; display: block; }
    figcaption { text-align: center; margin-top: 8px; font-size: 14px; font-weight: 750; }
    .meta { position: absolute; left: 56px; bottom: 16px; font-size: 12px; color: #8ea0c4; direction: ltr; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="kicker">HESABYAR · V3 · AURA</div>
      <h1>آئورا</h1>
      <p class="pitch">شیشه شب. مش بنفش و فیروزه‌ای، کارت یخی، و عدد درشت. تب‌ها و ثبت همیشه دم دست‌اند.</p>
    </div>
    <div class="swatches">
      <div class="sw"><i style="background:#07091a"></i><span>#07091A</span></div>
      <div class="sw"><i style="background:#3ee0ff"></i><span>#3EE0FF</span></div>
      <div class="sw"><i style="background:#7a4dff"></i><span>#7A4DFF</span></div>
      <div class="sw"><i style="background:#ff4fd8"></i><span>#FF4FD8</span></div>
      <div class="sw"><i style="background:#5dffe0"></i><span>#5DFFE0</span></div>
    </div>
  </header>
  <div class="row">
    <figure><div class="bezel phone"><img src="../screenshots/aura-login.png" alt="" /></div><figcaption>ورود</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/aura-home.png" alt="" /></div><figcaption>خانه</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/aura-transaction.png" alt="" /></div><figcaption>ثبت</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/aura-investments.png" alt="" /></div><figcaption>سبد</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/aura-asset.png" alt="" /></div><figcaption>دارایی</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/aura-reports.png" alt="" /></div><figcaption>گزارش</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/aura-settings.png" alt="" /></div><figcaption>تنظیمات</figcaption></figure>
    <figure><div class="bezel desk"><img src="../screenshots/aura-desktop.png" alt="" /></div><figcaption>دسکتاپ ۱۴۴۰</figcaption></figure>
  </div>
  <div class="meta">Vazirmatn · 390×844 · 1440×900</div>
</body>
</html>
