<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>ریتم — دسکتاپ</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="desk">
  <div class="desk-app">
    <div class="slash"></div>
    <aside class="side">
      <h1>ریتم</h1>
      <button class="on" type="button">خانه</button>
      <button type="button">گزارش</button>
      <button type="button">سبد</button>
      <button type="button">اقساط</button>
      <button type="button">تنظیمات</button>
    </aside>
    <main class="main">
      <div class="kicker">۳۰ مهر ۱۴۰۵ · سارا نادری</div>
      <div class="sub" style="margin-top:10px">ارزش خالص · تومان</div>
      <div class="num" style="font-size:64px">۴۰۵٬۵۰۰٬۰۰۰</div>
      <div class="dgrid">
        <div class="panel">
          <div class="sub">مهر · درآمد ۱۸٬۵۰۰٬۰۰۰ · هزینه ۶٬۲۴۰٬۰۰۰ · پس‌انداز ۶۶٪</div>
          <svg viewBox="0 0 700 200" style="width:100%;height:200px"><path class="draw" pathLength="1" d="M8 160 C80 140 140 80 220 100 C320 130 400 40 520 60 C600 70 650 30 690 24" fill="none" stroke="#dff25a" stroke-width="8"/></svg>
        </div>
        <div>
          <div class="panel" style="margin-bottom:10px">ملت · ۴۵۶۷<b style="display:block;font-size:22px">۸٬۵۰۰٬۰۰۰</b></div>
          <div class="panel" style="margin-bottom:10px">مسکن · ۲۱۴۰<b style="display:block;font-size:22px">۳۲٬۰۰۰٬۰۰۰</b></div>
          <div class="panel">هوده<b class="down" style="display:block;font-size:22px">−۱٬۲۰۰٬۰۰۰</b></div>
        </div>
      </div>
    </main>
  </div>
  <script>if (new URLSearchParams(location.search).get("shot")==="1") document.body.classList.add("shot");</script>
</body>
</html>
