<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>هاله — گزارش</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="status"><span>۹:۴۱</span><div class="island"></div><span>▮▮▮ ▭</span></div>
    <div class="scroll">
      <div class="sub">مهر ۱۴۰۵</div>
      <div class="h" style="font-size:26px">خرج این ماه</div>
      <div class="pair">
        <div class="card mini"><span class="sub">هزینه</span><b class="down">۶٬۲۴۰٬۰۰۰</b></div>
        <div class="card mini"><span class="sub">درآمد</span><b class="up">۱۸٬۵۰۰٬۰۰۰</b></div>
      </div>
      <div class="card" style="padding:14px;margin-top:10px">
        <div class="line"><span>خوراک</span><b>۲٬۰۰۰٬۰۰۰</b></div>
        <div class="bar"><span style="width:86%"></span></div>
        <div class="line"><span>اقساط</span><b>۱٬۷۵۰٬۰۰۰</b></div>
        <div class="bar"><span style="width:74%"></span></div>
        <div class="line"><span>حمل</span><b>۱٬۱۲۰٬۰۰۰</b></div>
        <div class="bar"><span style="width:48%"></span></div>
        <div class="line"><span>قبوض</span><b>۷۵۰٬۰۰۰</b></div>
        <div class="bar"><span style="width:32%"></span></div>
        <div class="line"><span>خرید</span><b>۶۲۰٬۰۰۰</b></div>
        <div class="bar"><span style="width:26%"></span></div>
      </div>
      <div class="card" style="padding:14px;margin-top:10px">
        <strong>سقف خوراک</strong>
        <div class="sub">۱٬۸۴۰٬۰۰۰ از ۳٬۰۰۰٬۰۰۰</div>
        <div class="bar"><span style="width:61%"></span></div>
        <strong>سقف اقساط</strong>
        <div class="sub">۳٬۲۰۰٬۰۰۰ از ۴٬۰۰۰٬۰۰۰</div>
        <div class="bar"><span style="width:80%"></span></div>
      </div>
    </div>
    <div class="dockwrap">
      <nav class="tab">
        <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>خانه</button>
        <button class="on" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7"/></svg>گزارش</button>
        <button class="add" type="button">+</button>
        <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18V6M12 18V9"/></svg>سبد</button>
        <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/></svg>تنظیم</button>
      </nav>
      <i class="homebar"></i>
    </div>
  </div>
</body>
</html>
