<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>سپید — گزارش</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="status"><span>۹:۴۱</span><div class="island"></div><span>▮▮▮ ▭</span></div>
    <div class="scroll">
      <div class="sub">مهر ۱۴۰۵</div>
      <div class="h" style="font-size:28px">هزینه ۶٬۲۴۰٬۰۰۰</div>
      <div class="stats"><span class="up">درآمد ۱۸٬۵۰۰٬۰۰۰</span><span class="sub">پس‌انداز ۶۶٪</span></div>
      <div class="chart" style="padding:14px 14px 6px">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>خوراک</span><span>۲٬۰۰۰٬۰۰۰</span></div>
        <div class="track"><span style="width:32%"></span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>اقساط</span><span>۱٬۷۵۰٬۰۰۰</span></div>
        <div class="track"><span style="width:28%"></span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>حمل‌ونقل</span><span>۱٬۱۲۰٬۰۰۰</span></div>
        <div class="track"><span style="width:18%"></span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>قبوض</span><span>۷۵۰٬۰۰۰</span></div>
        <div class="track"><span style="width:12%"></span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>خرید</span><span>۶۲۰٬۰۰۰</span></div>
        <div class="track"><span style="width:10%"></span></div>
      </div>
      <div class="sec"><h2>سقف بودجه</h2><span class="sub">تومان</span></div>
      <div class="line"><div><strong>خوراک</strong><span class="sub">۱٬۸۴۰٬۰۰۰ از ۳٬۰۰۰٬۰۰۰</span></div><b>۶۱٪</b></div>
      <div class="track"><span style="width:61%"></span></div>
      <div class="line"><div><strong>حمل</strong><span class="sub">۹۶۰٬۰۰۰ از ۱٬۵۰۰٬۰۰۰</span></div><b>۶۴٪</b></div>
      <div class="track"><span style="width:64%"></span></div>
      <div class="line"><div><strong>اقساط</strong><span class="sub">۳٬۲۰۰٬۰۰۰ از ۴٬۰۰۰٬۰۰۰</span></div><b>۸۰٪</b></div>
      <div class="track"><span style="width:80%"></span></div>
    </div>
    <nav class="tab">
      <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>خانه</button>
      <button class="on" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>گزارش</button>
      <button class="add" type="button">+</button>
      <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18h16M8 18v-5M12 18V9M16 18v-3"/></svg>سبد</button>
      <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/></svg>تنظیم</button>
      <i class="homebar"></i>
    </nav>
  </div>
</body>
</html>
