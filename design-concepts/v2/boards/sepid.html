<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>سپید — برد</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 3000px; height: 780px; overflow: hidden; }
    body {
      background: #e7e9ef;
      color: #101114;
      font-family: Vazirmatn, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      height: 168px; padding: 36px 72px 0;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #6d7380; }
    h1 { margin: 4px 0 0; font-size: 64px; font-weight: 800; line-height: 1; }
    .pitch { margin: 8px 0 0; font-size: 20px; color: #3a4150; font-weight: 550; }
    .swatches { display: flex; gap: 18px; direction: ltr; align-items: flex-start; }
    .sw i { display: block; width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(16,17,20,.12); }
    .sw span { display: block; margin-top: 6px; font-size: 11px; color: #6d7380; text-align: center; font-weight: 650; }
    .row { flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 16px; padding-top: 8px; }
    figure { margin: 0; }
    .bezel { background: #0c0d10; border-radius: 28px; padding: 7px; box-shadow: 0 18px 40px rgba(16,20,32,.16); }
    .phone img { width: 214px; height: 463px; object-fit: cover; border-radius: 22px; display: block; }
    .desk img { width: 740px; height: 463px; object-fit: cover; border-radius: 18px; display: block; }
    figcaption { text-align: center; margin-top: 10px; font-size: 14px; font-weight: 750; }
    .meta { position: absolute; left: 72px; bottom: 18px; font-size: 12px; color: #8b919c; letter-spacing: 0.04em; direction: ltr; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="kicker">HESABYAR · SEPID</div>
      <h1>سپید</h1>
      <p class="pitch">روشن و خلوت، با یک آبی قاطع. کارت‌های تخت، اعداد درشت، نوار پایین.</p>
    </div>
    <div class="swatches">
      <div class="sw"><i style="background:#f3f4f6"></i><span>#F3F4F6</span></div>
      <div class="sw"><i style="background:#ffffff"></i><span>#FFFFFF</span></div>
      <div class="sw"><i style="background:#101114"></i><span>#101114</span></div>
      <div class="sw"><i style="background:#1f4bff"></i><span>#1F4BFF</span></div>
      <div class="sw"><i style="background:#0c9a6a"></i><span>#0C9A6A</span></div>
    </div>
  </header>
  <div class="row">
    <figure><div class="bezel phone"><img src="../screenshots/sepid-login.png" alt="" /></div><figcaption>ورود</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/sepid-home.png" alt="" /></div><figcaption>خانه</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/sepid-transaction.png" alt="" /></div><figcaption>ثبت</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/sepid-investments.png" alt="" /></div><figcaption>سبد</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/sepid-asset.png" alt="" /></div><figcaption>دارایی</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/sepid-reports.png" alt="" /></div><figcaption>گزارش</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/sepid-settings.png" alt="" /></div><figcaption>تنظیمات</figcaption></figure>
    <figure><div class="bezel desk"><img src="../screenshots/sepid-desktop.png" alt="" /></div><figcaption>دسکتاپ ۱۴۴۰</figcaption></figure>
  </div>
  <div class="meta">Vazirmatn · 390×844 · 1440×900</div>
</body>
</html>
