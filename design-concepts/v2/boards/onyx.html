<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>اُنیکس — برد</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 3000px; height: 780px; overflow: hidden; }
    body { background: #12141a; color: #f4f5f7; font-family: Vazirmatn, sans-serif; display: flex; flex-direction: column; }
    header { height: 168px; padding: 36px 72px 0; display: flex; justify-content: space-between; align-items: flex-end; }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #9aa1ac; }
    h1 { margin: 4px 0 0; font-size: 64px; font-weight: 800; line-height: 1; }
    .pitch { margin: 8px 0 0; font-size: 20px; color: #c5c8d0; font-weight: 550; }
    .swatches { display: flex; gap: 18px; direction: ltr; }
    .sw i { display: block; width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
    .sw span { display: block; margin-top: 6px; font-size: 11px; color: #9aa1ac; text-align: center; font-weight: 650; }
    .row { flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 16px; padding-top: 8px; }
    figure { margin: 0; }
    .bezel { background: #05060a; border-radius: 28px; padding: 7px; box-shadow: 0 22px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06); }
    .phone img { width: 214px; height: 463px; object-fit: cover; border-radius: 22px; display: block; }
    .desk img { width: 740px; height: 463px; object-fit: cover; border-radius: 18px; display: block; }
    figcaption { text-align: center; margin-top: 10px; font-size: 14px; font-weight: 750; color: #d5d8de; }
    .meta { position: absolute; left: 72px; bottom: 18px; font-size: 12px; color: #7c838e; direction: ltr; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="kicker">HESABYAR · ONYX</div>
      <h1>اُنیکس</h1>
      <p class="pitch">فین‌تک تیره و آرام. کارت فلزی، دکمهٔ سفید، یک آبی یخی فقط برای نمودار و وضعیت.</p>
    </div>
    <div class="swatches">
      <div class="sw"><i style="background:#0c0d11"></i><span>#0C0D11</span></div>
      <div class="sw"><i style="background:#17191f"></i><span>#17191F</span></div>
      <div class="sw"><i style="background:#f4f5f7"></i><span>#F4F5F7</span></div>
      <div class="sw"><i style="background:#8eb6ff"></i><span>#8EB6FF</span></div>
      <div class="sw"><i style="background:#3ddc97"></i><span>#3DDC97</span></div>
    </div>
  </header>
  <div class="row">
    <figure><div class="bezel phone"><img src="../screenshots/onyx-login.png" alt="" /></div><figcaption>ورود</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/onyx-home.png" alt="" /></div><figcaption>خانه</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/onyx-transaction.png" alt="" /></div><figcaption>ثبت</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/onyx-investments.png" alt="" /></div><figcaption>سبد</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/onyx-asset.png" alt="" /></div><figcaption>دارایی</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/onyx-reports.png" alt="" /></div><figcaption>گزارش</figcaption></figure>
    <figure><div class="bezel phone"><img src="../screenshots/onyx-settings.png" alt="" /></div><figcaption>تنظیمات</figcaption></figure>
    <figure><div class="bezel desk"><img src="../screenshots/onyx-desktop.png" alt="" /></div><figcaption>دسکتاپ ۱۴۴۰</figcaption></figure>
  </div>
  <div class="meta">Vazirmatn · 390×844 · 1440×900</div>
</body>
</html>
