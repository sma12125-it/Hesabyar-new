<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>اُنیکس — گزارش</title>
  <link rel="stylesheet" href="../../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="status"><span>۹:۴۱</span><div class="island"></div><span>▮▮▮ ▭</span></div>
    <div class="scroll">
      <div class="sub">گزارش مهر ۱۴۰۵</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div><div class="sub">هزینه</div><div class="h" style="font-size:30px">۶٬۲۴۰٬۰۰۰</div></div>
        <div style="text-align:left"><div class="sub">درآمد</div><div class="up" style="font-size:18px">۱۸٬۵۰۰٬۰۰۰</div></div>
      </div>
      <div style="display:flex;gap:16px;align-items:center;margin-top:12px">
        <div class="donut" aria-hidden="true"></div>
        <div style="flex:1">
          <div class="line"><span>خوراک ۳۲٪</span><b>۲٬۰۰۰٬۰۰۰</b></div>
          <div class="line"><span>اقساط ۲۸٪</span><b>۱٬۷۵۰٬۰۰۰</b></div>
          <div class="line"><span>حمل ۱۸٪</span><b>۱٬۱۲۰٬۰۰۰</b></div>
          <div class="line"><span>سایر ۲۲٪</span><b>۱٬۳۷۰٬۰۰۰</b></div>
        </div>
      </div>
      <div class="sec"><h2>سقف‌ها</h2></div>
      <div class="line"><span>خوراک ۱٫۸۴ / ۳ م</span><b>۶۱٪</b></div>
      <div class="track"><span style="width:61%"></span></div>
      <div class="line"><span>حمل ۰٫۹۶ / ۱٫۵ م</span><b>۶۴٪</b></div>
      <div class="track"><span style="width:64%"></span></div>
      <div class="line"><span>اقساط ۳٫۲ / ۴ م</span><b>۸۰٪</b></div>
      <div class="track"><span style="width:80%"></span></div>
    </div>
    <nav class="tab">
      <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>خانه</button>
      <button class="on" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>گزارش</button>
      <button class="add" type="button">+</button>
      <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18V6M12 18V9"/></svg>سبد</button>
      <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/></svg>تنظیم</button>
      <i class="homebar"></i>
    </nav>
  </div>
</body>
</html>
