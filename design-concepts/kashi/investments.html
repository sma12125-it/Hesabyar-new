<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>کاشی — سرمایه‌گذاری</title>
  <link rel="stylesheet" href="../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="status"><span>۹:۴۱</span><div class="island"></div><span>▮▮▮ ▭</span></div>
    <div class="scroll">
      <div class="sub">سبد</div>
      <div class="h1" style="font-size:34px">۳۶۴٬۷۰۰٬۰۰۰</div>
      <div class="sub" style="margin-bottom:8px">تومان · بازده مانده <b class="up">+۴٫۶٪</b></div>
      <div class="chiprow">
        <button class="chip on" type="button">همه</button>
        <button class="chip" type="button">طلا</button>
        <button class="chip" type="button">سهام</button>
        <button class="chip" type="button">رمزارز</button>
        <button class="chip" type="button">سپرده</button>
      </div>
      <article class="tile inv"><div><strong>صندوق طلای کهربا</strong><em>عیار · ۴۲ واحد</em></div><div style="text-align:left"><b>۷۷٫۷ م</b><div class="up">+۱۲٫۴٪</div><svg class="spark" viewBox="0 0 84 36"><path d="M2 30 L16 28 L30 24 L44 20 L58 14 L80 6" fill="none" stroke="#0f6f78" stroke-width="2"/></svg></div></article>
      <article class="tile inv"><div><strong>فولاد مبارکه</strong><em>فولاد · ۸٬۰۰۰ سهم</em></div><div style="text-align:left"><b>۴۴ م</b><div class="up">+۸٫۲٪</div><svg class="spark" viewBox="0 0 84 36"><path d="M2 26 L20 22 L40 24 L60 16 L80 12" fill="none" stroke="#0f6f78" stroke-width="2"/></svg></div></article>
      <article class="tile inv"><div><strong>ربع سکه بهار</strong><em>۶ عدد · هر ۱۲٫۵ م</em></div><div style="text-align:left"><b>۷۵ م</b><div class="up">+۱۱٫۱٪</div><svg class="spark" viewBox="0 0 84 36"><path d="M2 28 L24 26 L48 18 L80 8" fill="none" stroke="#e0a106" stroke-width="2"/></svg></div></article>
      <article class="tile inv"><div><strong>بیت‌کوین</strong><em>۰٫۰۱۲ BTC</em></div><div style="text-align:left"><b>۴۸ م</b><div class="down">−۲٫۴٪</div><svg class="spark" viewBox="0 0 84 36"><path d="M2 10 L22 14 L44 12 L64 22 L80 28" fill="none" stroke="#c44536" stroke-width="2"/></svg></div></article>
      <article class="tile inv"><div><strong>سپرده ۱۸٪ سامان</strong><em>سررسید بهمن ۱۴۰۵</em></div><div style="text-align:left"><b>۱۲۰ م</b><div class="up">سالانه</div></div></article>
      <button class="add-dashed" type="button">+ کاشی خالی برای دارایی تازه، مثلاً ملک</button>
    </div>
    <nav class="dock">
      <button type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.5 12 4l8 6.5V20h-6v-5H10v5H4Z"/></svg>خانه</button>
      <button type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 19h3V9H4zm6 0h3V5h-3z"/></svg>گزارش</button>
      <button class="plus" type="button">+</button>
      <button class="on" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 14.5 9H22l-6 4.5L18.5 21 12 16.5 5.5 21 8 13.5 2 9h7.5Z"/></svg>سبد</button>
      <button type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>تنظیم</button>
      <div class="home-ind"></div>
    </nav>
  </div>
</body>
</html>
