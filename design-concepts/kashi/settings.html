<!DOCTYPE html>

      <div class="sub" style="margin-bottom:10px">sara.naderi@gmail.com · نگارش ۰.۳.۰</div>
      <div class="gridset">

        <div class="tile setc"><span>درباره</span><b>۰.۳.۰</b><span>حساب‌یار</span></div>

      <button class="on" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>تنظیم</button>
