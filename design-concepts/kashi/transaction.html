<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>کاشی — ثبت تراکنش</title>
  <link rel="stylesheet" href="../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="status"><span>۹:۴۱</span><div class="island"></div><span>▮▮▮ ▭</span></div>
    <div class="scroll">
      <div class="head">
        <button class="back" type="button">›</button>
        <h1>هزینه تازه</h1>
        <span class="chip on">تومان</span>
      </div>
      <div class="chiprow">
        <button class="chip on" type="button">هزینه</button>
        <button class="chip" type="button">درآمد</button>
        <button class="chip" type="button">انتقال</button>
      </div>
      <div class="amt-box tile"><div class="sub">مبلغ</div><div class="h1 down">۱۸۵٬۰۰۰</div></div>
      <div class="cats">
        <button class="cat on" type="button">خوراک</button>
        <button class="cat" type="button">حمل</button>
        <button class="cat" type="button">قبوض</button>
        <button class="cat" type="button">خرید</button>
        <button class="cat" type="button">سلامت</button>
        <button class="cat" type="button">اقساط</button>
        <button class="cat" type="button">هدیه</button>
        <button class="cat" type="button">سایر</button>
      </div>
      <div class="fake" style="margin-bottom:8px"><b>ملت — جاری</b><span class="sub">۸٬۵۰۰٬۰۰۰</span></div>
      <div class="fake"><b>هایپراستار تجریش</b><span class="sub">یادداشت</span></div>
      <div class="keys">
        <button class="key" type="button">۱</button><button class="key" type="button">۲</button><button class="key" type="button">۳</button>
        <button class="key" type="button">۴</button><button class="key" type="button">۵</button><button class="key" type="button">۶</button>
        <button class="key" type="button">۷</button><button class="key" type="button">۸</button><button class="key" type="button">۹</button>
        <button class="key" type="button">۰۰۰</button><button class="key" type="button">۰</button><button class="key" type="button">⌫</button>
      </div>
      <button class="btn" style="margin-top:8px" type="button">ثبت هزینه</button>
    </div>
  </div>
</body>
</html>
