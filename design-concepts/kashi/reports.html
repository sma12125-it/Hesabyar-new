<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>کاشی — گزارش</title>
  <link rel="stylesheet" href="../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="status"><span>۹:۴۱</span><div class="island"></div><span>▮▮▮ ▭</span></div>
    <div class="scroll">
      <div class="sub">گزارش مهر ۱۴۰۵</div>
      <div class="h1" style="font-size:26px">خرج کجا رفت؟</div>
      <div class="bento" style="margin-top:8px">
        <div class="tile mini"><em>هزینه</em><b class="down">۶٬۲۴۰٬۰۰۰</b></div>
        <div class="tile mini"><em>درآمد</em><b class="up">۱۸٬۵۰۰٬۰۰۰</b></div>
      </div>
      <div class="tile" style="padding:12px;margin-top:8px">
        <b>ترکیب هزینه</b>
        <div style="margin-top:8px;font-size:13px;font-weight:700">خوراک ۳۲٪ · ۲٬۰۰۰٬۰۰۰</div>
        <div class="meter"><span style="width:32%;background:#c44536"></span></div>
        <div style="font-size:13px;font-weight:700">اقساط ۲۸٪ · ۱٬۷۵۰٬۰۰۰</div>
        <div class="meter"><span style="width:28%"></span></div>
        <div style="font-size:13px;font-weight:700">حمل ۱۸٪ · ۱٬۱۲۰٬۰۰۰</div>
        <div class="meter"><span style="width:18%;background:#e0a106"></span></div>
        <div style="font-size:13px;font-weight:700">قبوض ۱۲٪ · ۷۵۰٬۰۰۰</div>
        <div class="meter"><span style="width:12%;background:#1f8a4c"></span></div>
        <div style="font-size:13px;font-weight:700">خرید ۱۰٪ · ۶۲۰٬۰۰۰</div>
        <div class="meter"><span style="width:10%;background:#5c5348"></span></div>
      </div>
      <div class="tile" style="padding:12px;margin-top:8px">
        <b>سقف‌ها</b>
        <div class="sub">خوراک ۱٫۸۴ از ۳ میلیون</div>
        <div class="meter"><span style="width:61%"></span></div>
        <div class="sub">اقساط ۳٫۲ از ۴ میلیون</div>
        <div class="meter"><span style="width:80%;background:#c44536"></span></div>
      </div>
      <div class="add-dashed" style="margin-top:8px">هدف «سفر شمال» خالی است · بسازید</div>
    </div>
    <nav class="dock">
      <button type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.5 12 4l8 6.5V20H4Z"/></svg>خانه</button>
      <button class="on" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 19h3V9H4zm6 0h3V5h-3z"/></svg>گزارش</button>
      <button class="plus" type="button">+</button>
      <button type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2 6h6l-5 4 2 6-5-3-5 3 2-6-5-4h6z"/></svg>سبد</button>
      <button type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>تنظیم</button>
      <div class="home-ind"></div>
    </nav>
  </div>
</body>
</html>
