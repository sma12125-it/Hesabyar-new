<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>سنج — جریان‌ها</title>
  <style>
    @font-face {
      font-family: Estedad;
      src: url("../fonts/Estedad-wght.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #101614; }
    body {
      width: 2520px;
      height: 1960px;
      color: #e7f0eb;
      font-family: Estedad, "Noto Sans Arabic", sans-serif;
      background:
        radial-gradient(800px 360px at 100% 0%, rgba(60, 186, 148, 0.08), transparent 60%),
        #101614;
      padding: 48px 56px 40px;
    }
    .eyebrow { margin: 0; color: #8ea099; font-size: 18px; font-weight: 600; }
    h1 { margin: 6px 0 0; font-size: 64px; font-weight: 560; letter-spacing: 0; }
    .lede { margin: 10px 0 0; font-size: 22px; line-height: 1.7; color: #c5d5cd; max-width: 820px; }
    .rule { width: 64px; height: 3px; background: #3cba94; border-radius: 2px; margin: 16px 0 8px; }
    section { margin-top: 28px; }
    h2 { margin: 0 0 14px; font-size: 22px; font-weight: 650; color: #d5e3db; }
    .flow { display: flex; justify-content: center; align-items: flex-start; gap: 10px; }
    .step { width: 300px; }
    .shot {
      width: 300px;
      aspect-ratio: 390 / 844;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(231, 240, 235, 0.16);
      background: #0c1210;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .step p { margin: 10px 0 0; text-align: center; font-size: 16px; font-weight: 620; color: #d5e3db; }
    .arrow {
      width: 36px;
      height: 649px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3cba94;
    }
    .arrow svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <p class="eyebrow">حساب‌یار · سنج</p>
  <h1>دو جریان</h1>
  <div class="rule"></div>
  <p class="lede">ثبت از الگو در چند ضربه، با واگرد. فروش دارایی قبل از تأیید می‌گوید سود تحقق‌یافتهٔ همین معامله چقدر است.</p>

  <section>
    <h2>ثبت هزینه</h2>
    <div class="flow">
      <div class="step"><div class="shot"><img src="../screenshots/sanj-home.png" alt=""></div><p>۱ · خانه</p></div>
      <div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 6l-6 6 6 6"/></svg></div>
      <div class="step"><div class="shot"><img src="../screenshots/sanj-add.png" alt=""></div><p>۲ · مبلغ</p></div>
      <div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 6l-6 6 6 6"/></svg></div>
      <div class="step"><div class="shot"><img src="../screenshots/sanj-add-filled.png" alt=""></div><p>۳ · الگو و دسته</p></div>
      <div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 6l-6 6 6 6"/></svg></div>
      <div class="step"><div class="shot"><img src="../screenshots/sanj-home-toast.png" alt=""></div><p>۴ · ثبت و واگرد</p></div>
    </div>
  </section>

  <section>
    <h2>فروش دارایی</h2>
    <div class="flow">
      <div class="step"><div class="shot"><img src="../screenshots/sanj-investments.png" alt=""></div><p>۱ · فهرست</p></div>
      <div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 6l-6 6 6 6"/></svg></div>
      <div class="step"><div class="shot"><img src="../screenshots/sanj-asset.png" alt=""></div><p>۲ · کهربا</p></div>
      <div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 6l-6 6 6 6"/></svg></div>
      <div class="step"><div class="shot"><img src="../screenshots/sanj-asset-sell.png" alt=""></div><p>۳ · پیش‌نمایش فروش</p></div>
      <div class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 6l-6 6 6 6"/></svg></div>
      <div class="step"><div class="shot"><img src="../screenshots/sanj-asset-done.png" alt=""></div><p>۴ · بعد از ثبت</p></div>
    </div>
  </section>
<script>document.fonts.ready.then(() => document.documentElement.classList.add("ready"));</script>
</body>
</html>
