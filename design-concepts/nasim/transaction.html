<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>نسیم — ثبت تراکنش</title>
  <link rel="stylesheet" href="../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="status"><span>۹:۴۱</span><div class="island"></div><span>▮▮▮ ▭</span></div>
    <div class="scroll">
      <div class="soft">یک یادداشت کوتاه برای دفتر</div>
      <div class="h1" style="font-size:30px">این یکی هزینه است</div>
      <div class="kinds">
        <button class="on" type="button">هزینه</button>
        <button type="button">درآمد</button>
        <button type="button">انتقال</button>
      </div>
      <div class="card" style="padding:16px;text-align:center;margin-bottom:12px">
        <div class="soft">مبلغ، تومان</div>
        <div class="h1 down" style="font-size:46px">۱۸۵٬۰۰۰</div>
      </div>
      <div class="soft" style="margin-bottom:6px">دسته را لمس کن</div>
      <div class="catp">
        <button class="on" type="button">خوراک</button>
        <button type="button">حمل</button>
        <button type="button">قبوض</button>
        <button type="button">خرید</button>
        <button type="button">سلامت</button>
        <button type="button">اقساط</button>
      </div>
      <div style="height:12px"></div>
      <label class="field"><span>از کدام حساب</span><div class="fake"><b>ملت — جاری</b><span class="soft">۸٬۵۰۰٬۰۰۰</span></div></label>
      <label class="field"><span>کی</span><div class="fake"><b>۳۰ مهر ۱۴۰۵</b><span class="soft">امروز</span></div></label>
      <label class="field"><span>یادداشت</span><input value="هایپراستار تجریش، خرید هفته" readonly /></label>
      <p class="soft">بعد از این، برای خوراک این ماه هنوز حدود یک میلیون تومان جا داری.</p>
      <button class="btn" type="button">بگذار توی دفتر</button>
    </div>
  </div>
</body>
</html>
