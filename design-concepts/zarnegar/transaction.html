<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>زرنگار — ثبت تراکنش</title>
  <link rel="stylesheet" href="../fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen">
    <div class="status"><span>۹:۴۱</span><div class="island"></div><span class="status-ico">▮▮▮ ▭</span></div>
    <div class="scroll" style="padding-top:6px">
      <div class="sheet-top">
        <button class="back" type="button" aria-label="بستن">›</button>
        <h1>سطر تازه در دفتر</h1>
        <button class="iconbtn" type="button" aria-label="صدا">♩</button>
      </div>
      <div class="seg">
        <button class="on" type="button">هزینه</button>
        <button type="button">درآمد</button>
        <button type="button">انتقال</button>
      </div>
      <div class="hero-amt">
        <div class="kicker">مبلغ به تومان</div>
        <div class="display down">۱۸۵٬۰۰۰</div>
      </div>
      <label class="field"><span>دسته‌بندی</span><div class="fake-input choice"><b>خوراک و سوپرمارکت</b><i>›</i></div></label>
      <label class="field"><span>از حساب</span><div class="fake-input choice"><b>ملت — جاری · ۸٬۵۰۰٬۰۰۰</b><i>›</i></div></label>
      <label class="field"><span>تاریخ</span><div class="fake-input choice"><b>جمعه ۳۰ مهر ۱۴۰۵</b><i>گاه‌شمار</i></div></label>
      <label class="field"><span>یادداشت</span><input value="هایپراستار تجریش، خرید هفتگی" readonly /></label>
      <p class="faint" style="font-size:12px;margin:0 0 14px">موجودی بعد از ثبت: ۸٬۳۱۵٬۰۰۰ تومان. سقف خوراک این ماه هنوز ۱٬۱۶۰٬۰۰۰ تومان جا دارد.</p>
      <button class="btn" type="button">ثبت در دفتر</button>
      <p class="fine">با کشیدن انگشت به چپ روی هر سطر، ویرایش باز می‌شود.</p>
    </div>
  </div>
</body>
</html>
