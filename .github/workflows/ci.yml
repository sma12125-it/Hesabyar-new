name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hesabyar-Android-APK
          path: |
            public/Hesabyar-Release.apk
            public/Hesabyar-v0.3.0.apk
